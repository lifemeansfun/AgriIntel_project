# Module 3 Pipeline Configuration

temporal_cv:
  # Walk-forward expanding window cross-validation
  # Folds defined by the test year
  test_years: [2015, 2016, 2017, 2018, 2019]
  min_train_years: 15  # 2000 to 2014

lightgbm:
  params:
    objective: 'quantile'
    metric: 'quantile'
    boosting_type: 'gbdt'
    learning_rate: 0.05
    num_leaves: 31
    max_depth: 8
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    verbose: -1
    n_jobs: -1
    random_state: 42
  
  num_boost_round: 500
  early_stopping_rounds: 50

quantiles:
  - 0.10
  - 0.50
  - 0.90

baseline:
  method: 'hierarchical_trailing_mean'
  window_years: 3

profit_ranking:
  risk_aversion_lambda: 0.5  # Controls the penalty for downside risk in recommendation score
